<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루 7분 금융×데이터 | 빅데이터를 활용한 디지털금융 전문가 과정 – 유비온 디지털교육센터</title>
<meta name="description" content="유비온 디지털교육센터 K-Digital Training 「빅데이터를 활용한 디지털금융 전문가 과정」 수강생을 위한 데일리 학습자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/r.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  --paper:#EEF2EC;      /* 통장 속지 같은 옅은 회녹색 */
  --sheet:#FBFCFA;
  --ink:#1B2A27;
  --ink-2:#4C5D58;
  --ink-3:#83918C;
  --rule:#D3DBD5;
  --rise:#C8323C;       /* 한국 시장의 상승 빨강 = 읽은 날 */
  --fall:#2F5BD3;
  --c-concept:#C8323C;
  --c-job:#2F5BD3;
  --c-code:#0E7C66;
  --c-issue:#B4730B;
  --c-paper:#6B4FA8;
  --focus:#2F5BD3;
  --serif:"Gowun Batang",serif;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A18;--sheet:#18221F;--ink:#E4ECE8;--ink-2:#AAB8B3;--ink-3:#71807B;--rule:#2C3934;
    --rise:#F0626B;--fall:#7C9BF0;--c-concept:#F0626B;--c-job:#7C9BF0;--c-code:#3FBF9D;--c-issue:#E3A63B;--c-paper:#A98AE6;--focus:#7C9BF0;
  }
}
:root[data-theme="dark"]{
  --paper:#121A18;--sheet:#18221F;--ink:#E4ECE8;--ink-2:#AAB8B3;--ink-3:#71807B;--rule:#2C3934;
  --rise:#F0626B;--fall:#7C9BF0;--c-concept:#F0626B;--c-job:#7C9BF0;--c-code:#3FBF9D;--c-issue:#E3A63B;--c-paper:#A98AE6;--focus:#7C9BF0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* 상단 */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;flex-direction:column;text-decoration:none;white-space:nowrap;line-height:1.25}
.brand .org{font-size:12px;color:var(--ink-2);font-weight:500}
.brand .org em{font-style:normal;color:var(--fall);font-weight:600}
.brand .name{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand b{color:var(--rise);font-weight:700}
.course{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.course strong{font-family:var(--serif);font-size:18px;font-weight:700}
.course span{font-size:14px;color:var(--ink-2)}
footer .org{display:flex;flex-direction:column;gap:2px}
footer .org strong{color:var(--ink-2);font-weight:600;font-size:14px}
footer a{color:var(--ink-2)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:14.5px;color:var(--ink-2);padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}
.nav a:hover{color:var(--ink)}
@media (max-width:640px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;gap:4px}
  .nav{margin-left:-10px;width:calc(100% + 10px);padding-bottom:6px}
}

main.wrap{padding-top:32px;padding-bottom:80px;min-height:70vh}
.muted{color:var(--ink-2)}
.small{font-size:14px}
h1,h2,h3{line-height:1.3;letter-spacing:-.015em}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,40px);margin:0 0 10px;font-weight:700}
h2{font-size:21px;margin:0 0 14px;font-weight:700}
.pagehead{margin-bottom:26px}
.pagehead p{margin:0;color:var(--ink-2);max-width:60ch}

/* 코너 표시 */
.corner{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--cc)}
.corner::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
[data-corner="concept"]{--cc:var(--c-concept)}
[data-corner="job"]{--cc:var(--c-job)}
[data-corner="code"]{--cc:var(--c-code)}
[data-corner="issue"]{--cc:var(--c-issue)}
[data-corner="paper"]{--cc:var(--c-paper)}

/* 홈: 오늘 */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.today{grid-template-columns:1fr}}
.lead{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px 30px;border-top:4px solid var(--cc,var(--ink))}
.lead .date{font-size:14px;color:var(--ink-2);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.lead h1 a{text-decoration:none}
.lead h1 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.lead .sub{font-size:17px;color:var(--ink-2);margin:0 0 18px}
.summary{list-style:none;padding:0;margin:0 0 22px;counter-reset:s}
.summary li{position:relative;padding-left:30px;margin:6px 0}
.summary li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;border:1px solid var(--rule);font:500 12px/18px var(--mono);text-align:center;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 18px;font-weight:600;text-decoration:none;font-size:15px}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn[aria-pressed="true"]{background:var(--rise);color:#fff}

.weekbox{padding:4px 0}
.weekbox .phase{font-size:13px;color:var(--ink-3);margin-bottom:2px}
.weekbox h2{font-family:var(--serif);font-size:23px;margin-bottom:12px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.topics li{font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule)}
.weeklist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.weeklist li{border-bottom:1px solid var(--rule)}
.weeklist a,.weeklist .slot{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:baseline;padding:10px 2px;text-decoration:none}
.weeklist .dow{font:500 13px var(--mono);color:var(--ink-3);white-space:nowrap}
.weeklist .t{font-size:15px}
.weeklist .slot .t{color:var(--ink-3)}
.weeklist a:hover .t{text-decoration:underline}
.readmark{font-size:12px;color:var(--rise);font-weight:600}

/* 과정 진도 + 달력 */
.progress{margin-top:44px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:24px 26px 22px}
.prog-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px;margin-bottom:16px}
.prog-head h2{margin:0 0 6px;font-size:15px;color:var(--ink-2);font-weight:600}
.dayno{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5vw,46px);line-height:1;letter-spacing:-.02em}
.dayno small{font:500 17px var(--sans);color:var(--ink-3);margin-left:6px;letter-spacing:0}
.prog-meta{font-size:14px;color:var(--ink-2);text-align:right}
.prog-meta strong{color:var(--ink)}
.track{display:flex;gap:3px;height:12px}
.seg{flex:var(--n) 1 0;min-width:0;background:var(--rule);border-radius:3px;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;width:var(--f);background:var(--rise)}
.seglabels{display:flex;gap:3px;margin-top:7px;font-size:12px;color:var(--ink-3)}
.seglabels span{flex:var(--n) 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seglabels span.cur{color:var(--ink);font-weight:600}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:22px 26px;margin-top:28px}
.month h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.month h3 small{font-weight:400;font-size:12px;color:var(--ink-3)}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-content:start}
.mgrid .dh{font-size:11.5px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cell{position:relative;height:42px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 14px/1 var(--mono);text-decoration:none;color:var(--ink);border:1px solid transparent}
.cell .n{font-size:9.5px;font-family:var(--sans);color:var(--ink-3);margin-top:3px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.cell.out{color:var(--ink-3);opacity:.35}
.cell.blank{visibility:hidden}
.cell.class{background:var(--paper)}
.cell.past{background:color-mix(in srgb,var(--rise) 16%,var(--paper))}
.cell.past .n{color:var(--ink-2)}
.cell.is-today{background:var(--rise);color:#fff}
.cell.is-today .n{color:#fff}
.cell.hol{color:var(--rise)}
.cell.hol .n{color:var(--rise)}
.cell.off{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--rule) 4px 5px);color:var(--ink-2)}
.cell.off .n{color:var(--ink-2)}
.cell.has::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.cell.has.read::after{background:var(--c-code)}
.cell.is-today.has::after{background:#fff}
a.cell:hover{border-color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:22px;font-size:13px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid var(--rule)}
@media (max-width:640px){.lead{padding:22px 20px}.progress{padding:20px 16px}.prog-meta{text-align:left}}

/* 글 목록 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:9px 12px;font:inherit;font-size:15px;color:var(--ink)}
select.search{flex:0 1 200px}
.list{list-style:none;margin:0;padding:0}
.list > li{border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:18px 2px;text-decoration:none}
.item .when{font:500 13px/1.6 var(--mono);color:var(--ink-3)}
.item h3{margin:2px 0 4px;font-size:18px;font-family:var(--serif)}
.item p{margin:0;color:var(--ink-2);font-size:15px}
.item:hover h3{text-decoration:underline}
@media (max-width:560px){.item{grid-template-columns:1fr;gap:4px}}
.weekhead{margin:30px 0 4px;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.weekhead strong{color:var(--ink);font-size:16px}

/* 글 상세 */
.article{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:48px}
@media (max-width:900px){.article{grid-template-columns:1fr;gap:28px}}
.article header{margin-bottom:24px}
.article .meta{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;margin:12px 0 0}
.article .sub{font-size:18px;color:var(--ink-2);margin:4px 0 0}
.sumbox{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 22px 10px;margin:0 0 30px}
.sumbox h2{font-size:15px;margin:0 0 6px;color:var(--ink-2)}
.prose{max-width:68ch;font-size:17px;line-height:1.85}
.prose h2{font-size:23px;margin:42px 0 12px;font-family:var(--serif)}
.prose h3{font-size:19px;margin:30px 0 8px}
.prose p{margin:0 0 18px}
.prose ul,.prose ol{padding-left:24px;margin:0 0 18px}
.prose li{margin:4px 0}
.prose blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:3px solid var(--cc,var(--ink));color:var(--ink-2)}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--sheet);border:1px solid var(--rule);padding:1px 5px;border-radius:4px}
.prose pre{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:14px;line-height:1.6;margin:0 0 22px}
.prose pre code{border:0;padding:0;background:none;font-size:inherit}
.prose table{border-collapse:collapse;width:100%;font-size:15px;margin:0 0 22px;display:block;overflow-x:auto}
.prose th,.prose td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{font-weight:600;border-bottom-color:var(--ink-3)}
.prose img{max-width:100%;height:auto;border-radius:8px}
.prose hr{border:0;border-top:1px solid var(--rule);margin:32px 0}
.prose a{color:var(--fall)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.hljs{background:transparent!important;color:var(--ink)}

.block{margin-top:44px;max-width:68ch}
.block > h2{font-size:19px;display:flex;align-items:center;gap:8px}
.quiz{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);padding:18px 20px;margin-bottom:12px}
.quiz .q{font-weight:600;margin:0 0 12px}
.quiz .opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--c-code);box-shadow:inset 0 0 0 1px var(--c-code)}
.opt.wrong{border-color:var(--rise);box-shadow:inset 0 0 0 1px var(--rise);opacity:.8}
.explain{margin:12px 0 0;font-size:15px;color:var(--ink-2)}
.explain strong{color:var(--ink)}
.terms{display:grid;gap:10px;margin:0}
.terms div{border-left:3px solid var(--rule);padding:2px 0 2px 14px}
.terms dt{font-weight:600}
.terms dt span{font-weight:400;color:var(--ink-3);font-size:14px;margin-left:6px}
.terms dd{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.sources{padding-left:20px;margin:0}
.sources li{margin:4px 0;font-size:15px}
.sources a{color:var(--fall)}
.side{position:sticky;top:84px;align-self:start;display:grid;gap:22px;font-size:14px}
@media (max-width:900px){.side{position:static}}
.side h3{font-size:13px;color:var(--ink-3);font-weight:500;margin:0 0 6px}
.side .tags{display:flex;flex-wrap:wrap;gap:6px}
.side .tags a{text-decoration:none;font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule)}
.side .tags a:hover{border-color:var(--ink-3)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:54px;max-width:68ch}
.pager a{display:block;border:1px solid var(--rule);border-radius:10px;padding:12px 16px;text-decoration:none;background:var(--sheet)}
.pager a:hover{border-color:var(--ink-3)}
.pager small{display:block;color:var(--ink-3);font-size:13px}
.pager .next{text-align:right;grid-column:2}

/* 용어사전 */
.glossary{columns:2 320px;column-gap:40px}
.glossary section{break-inside:avoid;margin-bottom:22px}
.glossary h2{font:600 15px var(--mono);color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:0 0 8px}
.glossary dl{margin:0}
.glossary dt{font-weight:600;margin-top:10px}
.glossary dt small{font-weight:400;color:var(--ink-3);margin-left:6px}
.glossary dd{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.glossary dd a{font-size:13px;color:var(--fall)}

/* 직무 */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.job{background:var(--sheet);padding:20px 20px 22px;text-decoration:none;display:block;border:1px solid var(--rule);border-radius:12px}
.job:hover{border-color:var(--ink-3)}
.job h3{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.job p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.job .where{font-size:13px;color:var(--ink-3)}
.jobdetail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px 40px;margin-top:26px}
.jobdetail h2{font-size:15px;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.jobdetail ul{margin:0;padding-left:20px}
.jobdetail li{margin:3px 0}

.jtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.jtags span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-2)}
.cmpwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
.cmp thead th{font-weight:600;color:var(--ink-2);font-size:13px}
.cmp tbody th{text-align:left;font-weight:600}
.cmp tbody th a{text-decoration:none}
.cmp tbody th a:hover{text-decoration:underline}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--c-job)}
.jobpage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px}
@media (max-width:900px){.jobpage{grid-template-columns:1fr;gap:28px}}
.jmain section{margin-bottom:34px}
.jmain h2{font-size:19px;margin:0 0 12px}
.jmain ul,.jmain ol{margin:0;padding-left:22px}
.jmain li{margin:5px 0}
.jintro{font-family:var(--serif);font-size:19px;line-height:1.75;margin:0 0 36px;max-width:62ch}
.timeline{list-style:none;padding:0!important;border-left:2px solid var(--rule);margin-left:4px!important}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:6px 0 6px 18px;position:relative;margin:0!important}
.timeline li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--c-job)}
.timeline time{font:500 14px var(--mono);color:var(--ink-2)}
ul.checks{list-style:none;padding:0!important}

<body>

    <button type="button" id="themeBtn">화면 밝기 바꾸기</button>

<script>
/* ================= 설정 ================= */
const CONFIG = {
  SUPABASE_URL: "https://jcwyubqwbrprqumfikbo.supabase.co",
  SUPABASE_KEY: "sb_publishable_OEHdr2ErKATvhgQ_O9XJPQ_220bLpBD", // 공개용(읽기 전용) 키
  COURSE_START: "2026-10-30",
  COURSE_END: "2027-04-16",
};
const CORNERS = {
  concept:{name:"오늘의 개념", dow:"월"},
  job:{name:"직무 돋보기", dow:"화"},
  code:{name:"개념 + 코드 한 스푼", dow:"수"},
  issue:{name:"이슈 브리핑", dow:"목"},
  paper:{name:"논문 한 입", dow:"금"},
};
const DOW = ["일","월","화","수","목","금","토"];

/* ================= 유틸 ================= */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayKST = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const fmtD = s => { const d = parseD(s); return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${DOW[d.getUTCDay()]})`; };
const fmtShort = s => { const d = parseD(s); return `${d.getUTCMonth()+1}.${String(d.getUTCDate()).padStart(2,"0")}`; };
const dowOf = s => DOW[parseD(s).getUTCDay()];
const addDays = (s,n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const readSet = () => new Set(store.get("dr.read", []));
function toggleRead(slug){
  const s = readSet(); s.has(slug) ? s.delete(slug) : s.add(slug);
  store.set("dr.read", [...s]); return s.has(slug);
}

/* ================= 데이터 ================= */
async function api(path){
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    headers:{ apikey:CONFIG.SUPABASE_KEY, Authorization:`Bearer ${CONFIG.SUPABASE_KEY}` }
  });
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
const LIST_COLS = "id,slug,publish_date,week_no,corner,title,subtitle,summary,tags,reading_min,related_job";
const cache = {};
const once = (k, f) => cache[k] ??= f().catch(e => { delete cache[k]; throw e; });
const getHolidays = () => once("hol",   () => api("daily_holidays?select=*&order=holiday_date"));
const getJobs     = () => once("jobs",  () => api("daily_jobs?select=*&order=sort_order"));
const getList     = () => once("list",  () => api(`daily_articles?select=${LIST_COLS}&order=publish_date.desc,id.desc`));
const getTerms    = () => once("terms", () => api("daily_terms?select=id,term,term_en,definition,article_id&order=term"));
const getArticle  = slug => once("a:"+slug, () => api(`daily_articles?select=*&slug=eq.${encodeURIComponent(slug)}&limit=1`).then(r => r[0] || null));

/* ================= 마크다운 + 수식 ================= */
marked.setOptions({ gfm:true, breaks:false });
function renderMd(md){
  const math = [];
  // $$...$$ 와 $...$ 를 먼저 빼 두었다가 렌더 후 되돌림 (마크다운이 수식을 망가뜨리지 않게)
  let src = String(md || "")
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => `%%KX${math.push({m, d:true})-1}%%`)
    .replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (_, p, m) => `${p}%%KX${math.push({m, d:false})-1}%%`);
  let html = DOMPurify.sanitize(marked.parse(src));
  html = html.replace(/%%KX(\d+)%%/g, (_, i) => {
    const {m, d} = math[+i];
    try { return katex.renderToString(m, {displayMode:d, throwOnError:false, output:"html"}); }
    catch(e){ return esc(m); }
  });
  return html;
}
function highlight(root){
  root.querySelectorAll("pre code").forEach(el => { try{ hljs.highlightElement(el); }catch(e){} });
  root.querySelectorAll(".prose a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}

/* ================= 화면 조각 ================= */
const cornerTag = c => `<span class="corner" data-corner="${esc(c)}">${esc(CORNERS[c]?.name || c)}</span>`;
const loading = () => `<div aria-busy="true" aria-label="불러오는 중"><div class="skeleton" style="width:30%"></div><div class="skeleton" style="width:70%;height:30px"></div><div class="skeleton"></div><div class="skeleton" style="width:85%"></div></div>`;
const errorBox = e => `<div class="empty err" role="alert"><strong>글을 불러오지 못했어요</strong>네트워크 연결을 확인한 뒤 새로고침해 주세요.<br><span class="small">(${esc(e.message).slice(0,140)})</span></div>`;
const mondayOf = d => { const w = parseD(d).getUTCDay(); return addDays(d, w === 0 ? -6 : 1 - w); };
const weekRange = d => { const m = mondayOf(d); const a = m < CONFIG.COURSE_START ? CONFIG.COURSE_START : m; const f = addDays(m, 4); const b = f > CONFIG.COURSE_END ? CONFIG.COURSE_END : f; return a === b ? fmtShort(a) : `${fmtShort(a)} – ${fmtShort(b)}`; };

function courseDays(holidays){
  const hol = new Set(holidays.map(h => h.holiday_date));
  const days = [];
  for(let d = CONFIG.COURSE_START; d <= CONFIG.COURSE_END; d = addDays(d,1)){
    const w = parseD(d).getUTCDay();
    if(w > 0 && w < 6 && !hol.has(d)) days.push(d);
  }
  return days;
}

/* ================= 페이지: 오늘 ================= */
async function pageHome(){
  const [holidays, list] = await Promise.all([getHolidays(), getList()]);
  const today = todayKST();
  const read = readSet();
  const latest = list[0];
  const anchor = today < CONFIG.COURSE_START ? CONFIG.COURSE_START : (today > CONFIG.COURSE_END ? CONFIG.COURSE_END : today);
  const wkMon = mondayOf(anchor), wkFri = addDays(wkMon, 4);
  const byDate = new Map(); list.forEach(a => { if(!byDate.has(a.publish_date)) byDate.set(a.publish_date, a); });

  // 오늘의 글
  let lead;
  if(!latest){
    lead = `<div class="empty"><strong>첫 글은 ${esc(fmtD(CONFIG.COURSE_START))} 아침에 올라와요</strong>매일 평일 아침, 수업 전에 7분이면 읽을 수 있는 글이 한 편씩 쌓입니다.</div>`;
  } else {
    const isToday = latest.publish_date === today;
    const isRead = read.has(latest.slug);
    lead = `<article class="lead" data-corner="${esc(latest.corner)}">
      <div class="date">${cornerTag(latest.corner)}<span>${isToday ? "오늘" : "가장 최근 글"} · ${esc(fmtD(latest.publish_date))}</span><span>${latest.reading_min}분</span></div>
      <h1><a href="#/a/${esc(latest.slug)}">${esc(latest.title)}</a></h1>
      ${latest.subtitle ? `<p class="sub">${esc(latest.subtitle)}</p>` : ""}
      ${latest.summary?.length ? `<ol class="summary">${latest.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
      <a class="btn" href="#/a/${esc(latest.slug)}">${isRead ? "다시 읽기" : "읽으러 가기"}</a>
    </article>`;
  }

  // 이번 주
  let weekHtml = "";
  {
    const days = courseDays(holidays).filter(d => d >= wkMon && d <= wkFri);
    weekHtml = `<aside class="weekbox" aria-label="이번 주">
      <div class="phase">${esc(weekRange(anchor))}</div>
      <h2>${today < CONFIG.COURSE_START ? "첫 주 데일리 리딩" : "이번 주 데일리 리딩"}</h2>
      <ul class="weeklist">${days.map(d => {
        const a = byDate.get(d);
        if(a) return `<li><a href="#/a/${esc(a.slug)}"><span class="dow">${dowOf(d)} ${fmtShort(d)}</span><span class="t">${esc(a.title)}</span>${read.has(a.slug) ? `<span class="readmark">읽음</span>` : "<span></span>"}</a></li>`;
        const c = Object.entries(CORNERS).find(([,v]) => v.dow === dowOf(d));
        return `<li><div class="slot"><span class="dow">${dowOf(d)} ${fmtShort(d)}</span><span class="t">${c ? esc(c[1].name) : ""}${d > today ? " · 예정" : ""}</span><span></span></div></li>`;
      }).join("")}</ul>
    </aside>`;
  }

  $app.innerHTML = `<div class="course"><strong>빅데이터를 활용한 디지털금융 전문가 과정</strong><span>K-Digital Training · 2026.10.30 – 2027.04.16 · 수업 전 7분 데일리 리딩</span></div><div class="today">${lead}${weekHtml}</div>${progressHtml(holidays, list, read, today)}`;
}

/* 과정 진도 + 달력 */
function progressHtml(holidays, list, read, today){
  const days = courseDays(holidays);
  const total = days.length;
  const idx = new Map(days.map((d,i) => [d, i+1]));
  const passed = days.filter(d => d <= today).length;
  const hol = new Map(holidays.map(h => [h.holiday_date, h]));
  const byDate = new Map(); list.forEach(a => { if(!byDate.has(a.publish_date)) byDate.set(a.publish_date, a); });

  // 큰 숫자
  let big, meta;
  if(today < CONFIG.COURSE_START){
    const dd = Math.round((parseD(CONFIG.COURSE_START) - parseD(today)) / 864e5);
    big = `개강 D-${dd}<small>총 ${total}일</small>`;
    meta = `${esc(fmtD(CONFIG.COURSE_START))} 개강`;
  } else if(today > CONFIG.COURSE_END){
    big = `수료<small>${total}일 완주</small>`;
    meta = `${esc(fmtD(CONFIG.COURSE_END))} 수료`;
  } else {
    const isClass = idx.has(today);
    big = isClass ? `${idx.get(today)}일차<small>/ ${total}일</small>` : `${passed}일 지남<small>/ ${total}일</small>`;
    const h = hol.get(today);
    meta = `${h ? `오늘은 ${esc(h.kind)}(${esc(h.name)}) · ` : (!isClass ? "오늘은 수업이 없는 날 · " : "")}남은 수업일 <strong>${total - passed}일</strong><br>진행률 ${Math.round(passed/total*100)}%`;
  }

  // 진행 막대 (월별 눈금)
  const pct = total ? passed/total*100 : 0;
  const track = `<div class="seg" style="--n:1"><i style="--f:${pct.toFixed(1)}%"></i></div>`;
  const monthsCount = [];
  days.forEach(d => { const m = d.slice(0,7); const last = monthsCount[monthsCount.length-1]; if(last && last.m === m) last.n++; else monthsCount.push({m, n:1}); });
  const labels = monthsCount.map(x => `<span style="--n:${x.n}" class="${today.slice(0,7) === x.m ? "cur" : ""}">${+x.m.slice(5)}월</span>`).join("");

  // 달력 (월~금)
  const months = [];
  for(let m = CONFIG.COURSE_START.slice(0,7); m <= CONFIG.COURSE_END.slice(0,7); ){
    months.push(m);
    const [y, mm] = m.split("-").map(Number);
    m = mm === 12 ? `${y+1}-01` : `${y}-${String(mm+1).padStart(2,"0")}`;
  }
  const cal = months.map(m => {
    const [y, mm] = m.split("-").map(Number);
    const first = `${m}-01`;
    const last = new Date(Date.UTC(y, mm, 0)).toISOString().slice(0,10);
    // 월~금 주 단위로 줄을 만들고, 과정 기간과 겹치지 않는 줄은 뺀다
    const rows = []; let row = null;
    for(let d = first; d <= last; d = addDays(d,1)){
      const w = parseD(d).getUTCDay();
      if(w === 0 || w === 6) continue;
      if(!row || w === 1){ row = new Array(5).fill(null); rows.push(row); }
      row[w-1] = d;
    }
    let cells = "", classN = 0;
    rows.filter(r => r.some(d => d && d >= CONFIG.COURSE_START && d <= CONFIG.COURSE_END)).forEach(r => r.forEach(d => {
      if(!d){ cells += `<span class="cell blank"></span>`; return; }
      const num = parseD(d).getUTCDate();
      const h = hol.get(d);
      if(d < CONFIG.COURSE_START || d > CONFIG.COURSE_END){ cells += `<span class="cell out">${num}</span>`; return; }
      if(h){
        cells += `<span class="cell ${h.kind === "휴강" ? "off" : "hol"}" title="${esc(fmtD(d))} · ${esc(h.kind)} (${esc(h.name)})" aria-label="${esc(fmtD(d))} ${esc(h.kind)}">${num}<span class="n">${esc(h.kind)}</span></span>`;
        return;
      }
      classN++;
      const a = byDate.get(d);
      const cls = ["cell","class", d < today && "past", d === today && "is-today", a && "has", a && read.has(a.slug) && "read"].filter(Boolean).join(" ");
      const label = `${fmtD(d)} · ${idx.get(d)}일차${a ? " · " + a.title : ""}`;
      const inner = `${num}<span class="n">${idx.get(d)}일차</span>`;
      cells += a ? `<a class="${cls}" href="#/a/${esc(a.slug)}" title="${esc(label)}" aria-label="${esc(label)}">${inner}</a>`
                 : `<span class="${cls}" title="${esc(label)}">${inner}</span>`;
    }));
    return `<div class="month"><h3>${y}년 ${mm}월<small>수업 ${classN}일</small></h3>
      <div class="mgrid"><span class="dh">월</span><span class="dh">화</span><span class="dh">수</span><span class="dh">목</span><span class="dh">금</span>${cells}</div></div>`;
  }).join("");

  return `<section class="progress" aria-label="과정 진도">
    <div class="prog-head">
      <div><h2>과정 진도</h2><div class="dayno">${big}</div></div>
      <div class="prog-meta">${meta}</div>
    </div>
    <div class="track" role="img" aria-label="전체 ${total}일 중 ${passed}일 진행">${track}</div>
    <div class="seglabels" aria-hidden="true">${labels}</div>
    <div class="months">${cal}</div>
    <div class="legend">
      <span><i style="background:color-mix(in srgb,var(--rise) 16%,var(--paper))"></i>지난 수업일</span>
      <span><i style="background:var(--rise);border-color:var(--rise)"></i>오늘</span>
      <span><i style="background:var(--paper)"></i>남은 수업일</span>
      <span><i style="background:transparent;border-color:var(--rise)"></i>공휴일</span>
      <span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--rule) 3px 4px)"></i>휴강</span>
      <span>점이 있는 날은 글이 있어요. 눌러서 읽을 수 있어요.</span>
    </div>
  </section>`;
}

/* ================= 페이지: 지난 글 ================= */
const archiveState = { corner:"", month:"", q:"" };
async function pageArchive(params){
  const list = await getList();
  if(params.tag) archiveState.q = params.tag;
  const read = readSet();
  const months = [...new Set(list.map(a => a.publish_date.slice(0,7)))];
  const monthOpts = months.map(m => `<option value="${m}">${m.slice(0,4)}년 ${+m.slice(5)}월</option>`).join("");
  $app.innerHTML = `<div class="pagehead"><h1>지난 글</h1><p>코너, 월, 키워드로 지금까지 올라온 글을 찾아보세요.</p></div>
    <div class="filters">
      <div class="chips" role="group" aria-label="코너">
        <button class="chip" data-c="" aria-pressed="false">전체</button>
        ${Object.entries(CORNERS).map(([k,v]) => `<button class="chip" data-c="${k}" aria-pressed="false">${v.name}</button>`).join("")}
      </div>
      <select class="search" id="wsel" aria-label="월"><option value="">전체 기간</option>${monthOpts}</select>
      <input class="search" id="q" type="search" placeholder="제목, 태그, 요약에서 찾기" aria-label="검색">
    </div>
    <div id="res"></div>`;
  const res = document.getElementById("res");
  const q = document.getElementById("q"), wsel = document.getElementById("wsel");
  q.value = archiveState.q; wsel.value = archiveState.month;
  const draw = () => {
    $app.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.c === archiveState.corner)));
    const term = archiveState.q.trim().toLowerCase();
    const rows = list.filter(a =>
      (!archiveState.corner || a.corner === archiveState.corner) &&
      (!archiveState.month || a.publish_date.startsWith(archiveState.month)) &&
      (!term || [a.title, a.subtitle, ...(a.tags||[]), ...(a.summary||[])].join(" ").toLowerCase().includes(term)));
    if(!list.length){ res.innerHTML = `<div class="empty"><strong>아직 올라온 글이 없어요</strong>첫 글은 ${esc(fmtD(CONFIG.COURSE_START))} 아침에 올라옵니다.</div>`; return; }
    if(!rows.length){ res.innerHTML = `<div class="empty"><strong>조건에 맞는 글이 없어요</strong>필터를 줄이거나 다른 키워드로 찾아보세요.</div>`; return; }

}

/* ================= 페이지: 용어사전 ================= */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const MERGE = {"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
function initial(s){
  const c = s.trim().charCodeAt(0);
  if(c >= 0xAC00 && c <= 0xD7A3){ const ch = CHO[Math.floor((c-0xAC00)/588)]; return MERGE[ch] || ch; }
  const ch = s.trim()[0]?.toUpperCase() || "#";
  return /[A-Z]/.test(ch) ? ch : "#";
}
async function pageTerms(){
  const [terms, list] = await Promise.all([getTerms(), getList()]);
  const byId = new Map(list.map(a => [a.id, a]));
  $app.innerHTML = `<div class="pagehead"><h1>용어사전</h1><p>글에 나온 용어가 매일 쌓여요. 지금까지 ${terms.length}개.</p></div>
    <div class="filters"><input class="search" id="tq" type="search" placeholder="용어 찾기 (한글·영문)" aria-label="용어 검색"></div><div id="tres"></div>`;
  const out = document.getElementById("tres"), q = document.getElementById("tq");
  const draw = () => {
    const k = q.value.trim().toLowerCase();
    const rows = terms.filter(t => !k || [t.term, t.term_en, t.definition].join(" ").toLowerCase().includes(k))
      .sort((a,b) => a.term.localeCompare(b.term, "ko"));
    if(!terms.length){ out.innerHTML = `<div class="empty"><strong>아직 용어가 없어요</strong>글이 올라오면 그날의 용어가 여기에 모입니다.</div>`; return; }
    if(!rows.length){ out.innerHTML = `<div class="empty"><strong>“${esc(q.value)}”에 해당하는 용어가 없어요</strong>철자를 바꾸거나 영문으로 찾아보세요.</div>`; return; }
    const groups = new Map();
    rows.forEach(t => { const g = initial(t.term); if(!groups.has(g)) groups.set(g, []); groups.get(g).push(t); });
    out.innerHTML = `<div class="glossary">${[...groups].map(([g, ts]) => `<section><h2>${esc(g)}</h2><dl>${ts.map(t => {
      const a = byId.get(t.article_id);
      return `<dt>${esc(t.term)}${t.term_en ? `<small>${esc(t.term_en)}</small>` : ""}</dt><dd>${esc(t.definition)}${a ? ` <a href="#/a/${esc(a.slug)}">${esc(fmtShort(a.publish_date))} 글에서</a>` : ""}</dd>`;
    }).join("")}</dl></section>`).join("")}</div>`;
  };
  q.addEventListener("input", draw); draw();
}

/* ================= 라우터 ================= */
async function route(){
  const raw = location.hash.slice(1) || "/";
  const [path, qs] = raw.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  const parts = path.split("/").filter(Boolean);
  const section = parts[0] === "a" ? "archive" : (parts[0] || "home");
  document.querySelectorAll("[data-nav]").forEach(a => {
    if(a.dataset.nav === section) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.title = "하루 7분 금융×데이터 | 빅데이터를 활용한 디지털금융 전문가 과정 – 유비온 디지털교육센터";
  $app.innerHTML = loading();
  window.scrollTo(0,0);
  try{
    if(!parts.length) await pageHome();
    else if(parts[0] === "a" && parts[1]) await pageArticle(decodeURIComponent(parts[1]));
    else if(parts[0] === "archive") await pageArchive(params);
    else if(parts[0] === "terms") await pageTerms();
    else if(parts[0] === "jobs" && parts[1]) await pageJob(decodeURIComponent(parts[1]));
    else if(parts[0] === "jobs") await pageJobs();
    else $app.innerHTML = `<div class="empty"><strong>없는 페이지예요</strong><a href="#/">오늘의 글로 가기</a></div>`;
  }catch(e){ console.error(e); $app.innerHTML = errorBox(e); }
}
window.addEventListener("hashchange", route);
